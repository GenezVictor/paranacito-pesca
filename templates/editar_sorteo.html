<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Editar {{ sorteo.titulo }} | Paranacito Pesca
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <main class="admin-formulario">

        <a
            href="{{ url_for('admin_sorteos') }}"
            class="admin-volver"
        >
            ← Volver a mis sorteos
        </a>

        <span class="admin-subtitulo">
            PARANACITO PESCA
        </span>

        <h1>Editar sorteo</h1>

        <p class="admin-formulario-ayuda">
            Modificá la información pública del sorteo.
        </p>


        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="titulo">
                Título
            </label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ sorteo.titulo }}"
                required
            >


            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                name="descripcion"
                rows="6"
            >{{ sorteo.descripcion or '' }}</textarea>


            <label for="precio_numero">
                Precio por número
            </label>

            <input
                type="number"
                id="precio_numero"
                name="precio_numero"
                value="{{ sorteo.precio_numero }}"
                min="1"
                step="0.01"
                required
            >


            <label for="max_numeros_por_persona">
                Máximo de números por persona
            </label>

            <input
                type="number"
                id="max_numeros_por_persona"
                name="max_numeros_por_persona"
                value="{{ sorteo.max_numeros_por_persona }}"
                min="1"
                max="{{ sorteo.cantidad_numeros }}"
                required
            >


            <div class="admin-cantidad-bloque">

                <span>
                    Cantidad total de números
                </span>

                <strong>
                    {{ sorteo.cantidad_numeros }}
                </strong>

                <small>
                    Por seguridad no se modifica desde
                    esta pantalla.
                </small>

            </div>


            <label class="admin-switch">

                <input
                    type="checkbox"
                    name="activo"
                    {% if sorteo.activo %}checked{% endif %}
                >

                <span>
                    Sorteo activo y visible al público
                </span>

            </label>


            <button
                type="submit"
                class="btn-participar"
            >
                Guardar cambios
            </button>

        </form>

    </main>

</body>

</html>
