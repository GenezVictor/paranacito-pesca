<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pago confirmado</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background: #111714;
    font-family: Arial, sans-serif;
    color: #f5f5f5;
">

    <div style="
        max-width: 600px;
        margin: 0 auto;
        padding: 35px 20px;
    ">

        <div style="
            background: #1b211e;
            border: 1px solid #343c37;
            border-radius: 16px;
            padding: 30px;
        ">

            <div style="
                color: #ffad27;
                font-size: 13px;
                font-weight: bold;
                letter-spacing: 2px;
            ">
                PARANACITO PESCA
            </div>

            <h1 style="
                margin: 12px 0 20px;
                color: #ffffff;
            ">
                ¡Tu pago fue confirmado!
            </h1>

            <p>
                Hola <strong>{{ nombre }}</strong>.
            </p>

            <p>
                Tu participación en
                <strong>{{ sorteo }}</strong>
                fue confirmada correctamente.
            </p>

            <div style="
                margin: 25px 0;
                padding: 20px;
                background: #111714;
                border-radius: 10px;
            ">

                <div style="
                    margin-bottom: 10px;
                    color: #aaa;
                ">
                    Tus números
                </div>

                <div style="
                    color: #ffad27;
                    font-size: 24px;
                    font-weight: bold;
                ">
                    {{ numeros }}
                </div>

            </div>

            <p style="color: #aaa;">
                Guardá este correo como comprobante de tu participación.
            </p>

            <p style="
                margin-top: 30px;
                color: #ffad27;
                font-weight: bold;
            ">
                ¡Mucha suerte!
            </p>

        </div>

    </div>

</body>
</html>
