<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Editar pack | Paranacito Pesca
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="admin-contenedor">

        <div class="admin-encabezado">

            <div>
                <span class="admin-subtitulo">
                    PARANACITO PESCA
                </span>

                <h1>
                    Editar {{ pack.nombre }}
                </h1>
            </div>

            <a
                href="{{ url_for(
                    'administrar_packs',
                    sorteo_id=sorteo.id
                ) }}"
                class="admin-boton"
            >
                Volver a packs
            </a>

        </div>


        <article class="admin-sorteo">

            <div class="admin-info">

                <form method="POST">

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >


                    <div class="campo">

                        <label for="nombre">
                            Nombre del pack
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            value="{{ pack.nombre }}"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="cantidad">
                            Cantidad de chances
                        </label>

                        <input
                            type="number"
                            id="cantidad"
                            name="cantidad"
                            min="1"
                            max="{{ sorteo.cantidad_numeros }}"
                            value="{{ pack.cantidad }}"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="precio">
                            Precio total
                        </label>

                        <input
                            type="number"
                            id="precio"
                            name="precio"
                            min="1"
                            step="0.01"
                            value="{{ pack.precio }}"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-participar"
                    >
                        Guardar cambios
                    </button>

                </form>

            </div>

        </article>

    </main>

</body>

</html>
