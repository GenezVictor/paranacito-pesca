<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participar - {{ sorteo.titulo }}</title>
</head>

<body>

    <h1>{{ sorteo.titulo }}</h1>

    <p>
        {{ sorteo.descripcion }}
    </p>

    <p>
        Precio por número:
        ${{ sorteo.precio_numero | moneda }}
    </p>

    <p>
        Máximo de números:
        {{ sorteo.max_numeros_por_persona }}
    </p>

    <h2>Datos del participante</h2>

    <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="nombre">
            Nombre
        </label>

        <br>

        <input
            type="text"
            id="nombre"
            name="nombre"
            required
        >

        <br><br>


        <label for="email">
            Email
        </label>

        <br>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>


        <label for="telefono">
            Teléfono
        </label>

        <br>

        <input
            type="tel"
            id="telefono"
            name="telefono"
            required
        >

        <br><br>


        <label for="cantidad">
            Cantidad de números
        </label>

        <br>

        <input
            type="number"
            id="cantidad"
            name="cantidad"
            min="1"
            max="{{ sorteo.max_numeros_por_persona }}"
            value="1"
            required
        >

        <br><br>

        <button type="submit">
            Obtener mis números
        </button>

    </form>

</body>

</html>
